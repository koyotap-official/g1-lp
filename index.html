<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>◯◯パズル 先行登録受付中</title>
  <meta name="description" content="新感覚パズルゲームの先行登録ページ" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <img id="hero-image" src="" alt="ゲームのイメージ画像" class="hero-image" />
      <h1 id="title">読み込み中...</h1>
      <p id="tagline">読み込み中です。しばらくお待ちください。</p>
    </header>

    <main>
      <section class="cta-section">
        <button type="button" id="cta-button" class="cta-button">事前登録して先行プレイ</button>
      </section>

      <section class="form-section">
        <form id="signup-form" method="POST" action="#" novalidate>
          <label for="email-input">メールアドレス</label>
          <input
            id="email-input"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
          />

          <input type="hidden" name="utm_source" value="" />
          <input type="hidden" name="utm_campaign" value="" />
          <input type="hidden" name="variant" value="" />

          <button type="submit" class="submit-button">登録する</button>
        </form>

        <div id="thank-you" style="display:none" class="thank-you">
          ご登録ありがとうございます！先行プレイの詳細は追ってメールでご連絡します。
        </div>

        <div id="config-error" style="display:none" class="config-error">
          設定の読み込みに失敗しました。しばらくしてから再度お試しください。 / Failed to load configuration. Please try again later.
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Game Concept Ad-Testing Gate</p>
    </footer>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
